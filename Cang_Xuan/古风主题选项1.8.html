<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>古风行动选项</title>
    <style>
      :root {
        --corner-radius: 16px;
        --spacing-xs: 6px;
        --spacing-s: 10px;
        --spacing-m: 14px;
        --spacing-l: 18px;

        --primary-gold: #c9a961;
        --primary-jade: #5a8a7e;
        --primary-red: #a73a3a;
        --primary-purple: #7a5a8a;
        --primary-blue: #4a7c9e;

        --bg-primary: #faf8f5;
        --bg-secondary: #fff9f0;
        --text-primary: #3a3330;
        --text-secondary: #6a635a;
        --border-color: #d4c4b0;
        --border-light: #e8ddd4;
        --shadow-light: rgba(58, 51, 48, 0.08);
        --shadow-medium: rgba(58, 51, 48, 0.12);
        --shadow-strong: rgba(58, 51, 48, 0.18);

        --glass-panel: rgba(255, 255, 255, 0.58);
        --glass-panel-strong: rgba(255, 255, 255, 0.72);
        --glass-panel-soft: rgba(255, 249, 240, 0.42);
        --glass-border: rgba(255, 255, 255, 0.55);
        --glass-shine: rgba(255, 255, 255, 0.28);

        --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "STSong", "SimSun", "宋体", -apple-system, BlinkMacSystemFont, serif;
        color: var(--text-primary);
        padding: 8px;
        background: transparent;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      #options-wrapper {
        width: min(100%, 800px);
        margin: 0 auto;
        position: relative;
      }

      .expand-toggle {
        min-width: 132px;
        height: 28px;
        padding: 0 12px;
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%) translateY(10px);
        opacity: 0;
        pointer-events: none;
        z-index: 3;
        background: var(--glass-panel-strong);
        color: var(--text-secondary);
        border: 1px solid var(--glass-border);
        border-radius: 999px;
        cursor: pointer;
        letter-spacing: 0.6px;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        backdrop-filter: blur(6px) saturate(120%);
        -webkit-backdrop-filter: blur(6px) saturate(120%);
        transition: opacity 0.24s var(--transition-smooth), transform 0.24s var(--transition-smooth), color 0.2s var(--transition-smooth), border-color 0.2s var(--transition-smooth);
      }

      .expand-toggle:hover {
        color: var(--primary-gold);
        border-color: var(--primary-gold);
      }

      .options-shell.collapsed .expand-toggle {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
        pointer-events: auto;
      }

      .options-shell {
        background: var(--glass-panel);
        border-radius: 16px 12px 18px 14px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 12px 30px var(--shadow-medium);
        overflow: hidden;
        position: relative;
        isolation: isolate;
        padding-bottom: 0;
        backdrop-filter: blur(14px) saturate(130%);
        -webkit-backdrop-filter: blur(14px) saturate(130%);
        transition: padding-bottom 0.24s var(--transition-smooth);
      }

      .options-shell.collapsed {
        padding-bottom: 40px;
      }

      .options-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background:
          linear-gradient(165deg, var(--glass-shine) 0%, transparent 42%, var(--glass-shine) 100%),
          repeating-linear-gradient(
            0deg,
            rgba(80, 80, 90, 0.05) 0,
            rgba(80, 80, 90, 0.05) 1px,
            transparent 1px,
            transparent 28px
          );
      }

      .options-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--spacing-m) var(--spacing-l);
        border-bottom: 1px solid var(--border-light);
        position: relative;
        z-index: 1;
        background: linear-gradient(120deg, rgba(127, 154, 175, 0.12), transparent 50%);
        transition: border-color 0.24s var(--transition-smooth);
      }

      .options-shell.collapsed .options-header {
        border-bottom-color: transparent;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: var(--spacing-s);
        min-width: 0;
      }

      .header-icon {
        width: 20px;
        height: 20px;
        fill: var(--primary-gold);
        flex: 0 0 auto;
      }

      .title-group {
        min-width: 0;
      }

      .options-title {
        color: var(--text-primary);
        font-size: 16px;
        letter-spacing: 2px;
        font-weight: 600;
        white-space: nowrap;
      }

      .options-subtitle {
        color: var(--text-secondary);
        font-size: 12px;
        letter-spacing: 0.5px;
        margin-top: 2px;
      }

      .header-controls {
        display: flex;
        gap: var(--spacing-xs);
        align-items: center;
        flex-shrink: 0;
      }

      .control-btn {
        background: var(--glass-panel-strong);
        color: var(--text-secondary);
        border: 1px solid var(--border-light);
        border-radius: 999px;
        height: 30px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all 0.18s var(--transition-smooth);
        backdrop-filter: blur(6px) saturate(120%);
        -webkit-backdrop-filter: blur(6px) saturate(120%);
      }

      .mode-toggle {
        min-width: 98px;
        padding: 0 10px;
        font-size: 12px;
        letter-spacing: 0.5px;
      }

      .mode-toggle.mode-send {
        color: var(--primary-gold);
      }

      .mode-toggle.mode-input {
        color: var(--primary-blue);
      }

      .mode-toggle.mode-append {
        color: var(--primary-jade);
      }

      .icon-btn {
        width: 30px;
        border-radius: 50%;
      }

      .icon-btn svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }

      .options-content {
        position: relative;
        z-index: 1;
        overflow: hidden;
        max-height: 760px;
        opacity: 1;
        transform: translateY(0);
        transition: max-height 0.36s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.24s var(--transition-smooth), transform 0.28s var(--transition-smooth);
      }

      .options-shell.collapsed .options-content {
        max-height: 0;
        opacity: 0;
        transform: translateY(-8px);
      }

      .options-grid {
        padding: var(--spacing-l);
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--spacing-s);
        transition: padding 0.24s var(--transition-smooth);
      }

      @media (min-width: 520px) {
        .options-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .option-item {
        background: var(--glass-panel-soft);
        color: var(--text-primary);
        border: 1px solid var(--border-light);
        border-radius: 12px;
        padding: 12px 14px;
        text-align: left;
        letter-spacing: 0.2px;
        font-size: 14px;
        line-height: 1.45;
        cursor: pointer;
        opacity: 0;
        animation: optionIn 0.25s var(--transition-smooth) forwards;
        transition: background-color 0.18s var(--transition-smooth), border-color 0.18s var(--transition-smooth), box-shadow 0.18s var(--transition-smooth);
        backdrop-filter: blur(4px) saturate(115%);
        -webkit-backdrop-filter: blur(4px) saturate(115%);
      }

      .option-item.sending {
        animation: optionSend 0.22s var(--transition-smooth) forwards;
      }

      .option-empty {
        color: var(--text-secondary);
        border: 1px dashed var(--border-color);
        border-radius: 12px;
        padding: 16px;
        text-align: center;
        font-size: 13px;
      }

      @keyframes optionIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes optionSend {
        0% {
          border-color: var(--primary-gold);
        }
        100% {
          background: var(--primary-gold);
          color: var(--bg-primary);
          border-color: var(--primary-gold);
        }
      }

      @media (max-width: 768px) {
        body {
          padding: 8px;
        }

        .options-header {
          padding: var(--spacing-s) var(--spacing-m);
        }

        .options-title {
          font-size: 14px;
        }

        .options-subtitle {
          display: none;
        }

        .mode-toggle {
          min-width: 84px;
          font-size: 11px;
          padding: 0 8px;
        }

        .options-grid {
          padding: var(--spacing-m);
        }

        .option-item {
          font-size: 13px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition-duration: 0.01ms !important;
        }

        .option-item {
          opacity: 1;
        }
      }

        --action-ink: #2c1c12;
        --action-ink-soft: #654a35;
        --action-gold: #a86f28;
        --action-focus: rgba(126, 76, 29, 0.82);
        --action-paper-overlay: transparent;
      }

      .options-shell {
        padding-bottom: 0;
        overflow: hidden;
        background: transparent;
        border: clamp(28px, 5.5vw, 44px) solid transparent;
        border-radius: 0;
        border-image-source: var(--action-frame-image);
        border-image-slice: 96 82 fill;
        border-image-width: 1;
        border-image-repeat: stretch;
        box-shadow: none;
        filter: drop-shadow(0 12px 15px rgba(32, 18, 10, 0.34));
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .options-shell.collapsed {
        padding-bottom: 46px;
      }

      .options-shell::before {
        display: none;
      }

      .options-header {
        min-height: 54px;
        padding: 2px 4px 10px;
        color: var(--action-ink);
        background: transparent;
        border-bottom: 1px solid rgba(91, 59, 31, 0.3);
        box-shadow: 0 1px rgba(255, 248, 224, 0.5);
      }

      .header-left {
        gap: 8px;
      }

      .header-icon {
        width: 24px;
        height: 24px;
        fill: var(--action-gold);
        filter: drop-shadow(0 1px rgba(255, 240, 197, 0.42));
      }

      .options-title {
        color: var(--action-ink);
        font-family: "STKaiti", "KaiTi", "STSong", "SimSun", serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-shadow: 0 1px rgba(255, 247, 222, 0.62);
      }

      .options-subtitle {
        color: var(--action-ink-soft);
        letter-spacing: 0.08em;
      }

      .header-controls {
        gap: 8px;
      }

      .control-btn {
        height: 44px;
        padding: 0;
        color: #2e2017;
        background-color: transparent;
        background-position: center;
        background-size: 100% 100%;
        background-repeat: no-repeat;
        border: 0;
        border-radius: 0;
        font-family: "STKaiti", "KaiTi", "STSong", serif;
        font-weight: 700;
        text-shadow: 0 1px rgba(255, 248, 225, 0.7);
        filter: drop-shadow(0 3px 3px rgba(42, 25, 13, 0.24));
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .control-btn:hover,
      .control-btn:focus-visible {
        color: #25160e;
        background-color: transparent;
        border-color: transparent;
        outline: none;
        filter: brightness(1.1) drop-shadow(0 4px 4px rgba(42, 25, 13, 0.3));
      }

      .mode-toggle:hover,
      .mode-toggle:focus-visible {
        background-color: transparent;
        background-image: var(--action-mode-image);
        background-position: center;
        background-size: 100% 100%;
        background-repeat: no-repeat;
      }

      .icon-btn:hover,
      .icon-btn:focus-visible {
        background-color: transparent;
        background-image: var(--action-round-image);
        background-position: center;
        background-size: 100% 100%;
        background-repeat: no-repeat;
      }

      .control-btn:focus-visible,
      .option-item:focus-visible,
      .expand-toggle:focus-visible {
        box-shadow: inset 0 0 0 2px var(--action-focus);
      }

      .mode-toggle {
        width: 116px;
        min-width: 116px;
        padding: 0 25px;
        background-image: var(--action-mode-image);
        font-size: 12px;
        letter-spacing: 0.04em;
      }

      .mode-toggle.mode-send,
      .mode-toggle.mode-input,
      .mode-toggle.mode-append {
        color: #2d2017;
      }

      .icon-btn {
        width: 44px;
        flex: 0 0 44px;
        background-image: var(--action-round-image);
        border-radius: 50%;
      }

      .icon-btn svg {
        width: 17px;
        height: 17px;
        fill: #35241a;
        filter: drop-shadow(0 1px rgba(255, 244, 215, 0.56));
      }

      .options-grid {
        padding: 16px 10px 18px;
        gap: 10px;
      }

      .option-item {
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px clamp(42px, 7vw, 58px);
        color: #2b1d14;
        background-color: transparent;
        background-image: var(--action-option-image);
        background-position: center;
        background-size: 100% 100%;
        background-repeat: no-repeat;
        border: 0;
        border-radius: 0;
        font-family: "STKaiti", "KaiTi", "STSong", "SimSun", serif;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.45;
        text-align: center;
        text-shadow: 0 1px rgba(255, 250, 230, 0.72);
        filter: drop-shadow(0 4px 4px rgba(39, 23, 12, 0.24));
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        transition:
          filter 160ms var(--transition-smooth),
          transform 160ms var(--transition-smooth);
      }

      .option-item:hover,
      .option-item:focus-visible {
        color: #21150e;
        background-color: transparent;
        background-image: var(--action-option-image);
        background-position: center;
        background-size: 100% 100%;
        background-repeat: no-repeat;
        border-color: transparent;
        outline: none;
        filter: brightness(1.09) drop-shadow(0 5px 5px rgba(39, 23, 12, 0.3));
        transform: translateY(-1px);
      }

      .option-item:active {
        background-color: transparent;
        background-image: var(--action-option-image);
        background-position: center;
        background-size: 100% 100%;
        background-repeat: no-repeat;
        filter: brightness(0.94) drop-shadow(0 2px 2px rgba(39, 23, 12, 0.22));
        transform: translateY(1px) scale(0.995);
      }

      .option-empty {
        grid-column: 1 / -1;
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px clamp(42px, 7vw, 58px);
        color: #654a35;
        background-color: transparent;
        background-image: var(--action-option-image);
        background-position: center;
        background-size: 100% 100%;
        background-repeat: no-repeat;
        border: 0;
        border-radius: 0;
        font-family: "STKaiti", "KaiTi", "STSong", "SimSun", serif;
        font-size: 14px;
        font-weight: 700;
        text-shadow: 0 1px rgba(255, 250, 230, 0.72);
        filter: saturate(0.72) opacity(0.82) drop-shadow(0 3px 3px rgba(39, 23, 12, 0.18));
      }

      .expand-toggle {
        width: 184px;
        min-width: 184px;
        height: 44px;
        bottom: 3px;
        padding: 0 38px;
        color: #2d2017;
        background-color: transparent;
        background-image: var(--action-expand-image);
        background-position: center;
        background-size: 100% 100%;
        background-repeat: no-repeat;
        border: 0;
        border-radius: 0;
        font-family: "STKaiti", "KaiTi", "STSong", serif;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        text-shadow: 0 1px rgba(255, 248, 225, 0.72);
        filter: drop-shadow(0 3px 3px rgba(42, 25, 13, 0.25));
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }

      .expand-toggle:hover,
      .expand-toggle:focus-visible {
        color: #25160e;
        border-color: transparent;
        outline: none;
        filter: brightness(1.1) drop-shadow(0 4px 4px rgba(42, 25, 13, 0.3));
      }

      @keyframes optionSend {
        0% {
          filter: brightness(1.08) drop-shadow(0 4px 4px rgba(39, 23, 12, 0.28));
        }
        100% {
          color: #20130c;
          background-color: transparent;
          filter: brightness(1.2) drop-shadow(0 2px 2px rgba(39, 23, 12, 0.22));
          transform: scale(0.99);
        }
      }

      @media (max-width: 768px) {
        .options-shell {
          border-width: clamp(24px, 7vw, 34px);
        }

        .options-header {
          min-height: 48px;
          padding: 0 1px 8px;
        }

        .options-title {
          font-size: 17px;
        }

        .header-controls {
          gap: 5px;
        }

        .mode-toggle {
          width: 92px;
          min-width: 92px;
          height: 40px;
          padding: 0 18px;
          font-size: 11px;
        }

        .icon-btn {
          width: 40px;
          height: 40px;
          flex-basis: 40px;
        }

        .options-grid {
          padding: 12px 2px 14px;
          gap: 8px;
        }

        .option-item {
          min-height: 66px;
          padding: 10px 40px;
          font-size: 14px;
        }
      }

      @media (max-width: 430px) {
        .header-icon {
          display: none;
        }

        .options-title {
          font-size: 16px;
          letter-spacing: 0.08em;
        }

        .mode-toggle {
          width: 84px;
          min-width: 84px;
          padding-inline: 15px;
        }
      }
    </style>
  </head>

  <body>
    <div id="options-wrapper">
      <div class="options-shell" id="optionsShell">
        <div class="options-header">
          <div class="header-left">
            <svg class="header-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2l-5.5 9h11z" />
              <circle cx="12" cy="17.5" r="4.5" />
            </svg>
            <div class="title-group">
              <div class="options-title">行动选项</div>
              <div class="options-subtitle">三态模式 · 循环切换</div>
            </div>
          </div>

          <div class="header-controls">
            <button class="control-btn mode-toggle" id="modeToggle" type="button"></button>
            <button class="control-btn icon-btn" id="collapseToggle" type="button" aria-label="收起/展开">
              <svg viewBox="0 0 24 24" id="collapseIcon"><path d="M7 10l5 5 5-5z" /></svg>
            </button>
          </div>
        </div>

        <div class="options-content" id="optionsContent">
          <div class="options-grid" id="optionsGrid"></div>
        </div>

        <button class="expand-toggle" id="expandToggle" type="button">展开选项 ▾</button>
      </div>
    </div>

    <script>
      const OPTIONS_MODE_KEY = "cangxuan_options_mode_v1";

      const optionsShell = document.getElementById("optionsShell");
      const optionsGrid = document.getElementById("optionsGrid");
      const modeToggle = document.getElementById("modeToggle");
      const collapseToggle = document.getElementById("collapseToggle");
      const collapseIcon = document.getElementById("collapseIcon");
      const expandToggle = document.getElementById("expandToggle");
      const MODE_LIST = [
        {
          id: "send",
          short: "直发",
          className: "mode-send",
          autoCollapse: true,
          action: (text) => {
            triggerSlash(`/send ${text}|/trigger`);
          },
        },
        {
          id: "input",
          short: "填入",
          className: "mode-input",
          autoCollapse: true,
          action: (text) => {
            triggerSlash(`/setinput ${text}`);
          },
        },
        {
          id: "append",
          short: "追加",
          className: "mode-append",
          autoCollapse: false,
          action: (text) => {
            const current = getInputText();
            const merged = current ? `${current}\n${text}` : text;
            triggerSlash(`/setinput ${merged}`);
          },
        },
      ];

      let currentModeIndex = 0;
      let isCollapsed = false;

      function renderModeButton() {
        const mode = MODE_LIST[currentModeIndex];
        modeToggle.textContent = `模式:${mode.short}`;
        modeToggle.classList.remove("mode-send", "mode-input", "mode-append");
        modeToggle.classList.add(mode.className);
      }

      function cycleMode() {
        currentModeIndex = (currentModeIndex + 1) % MODE_LIST.length;
        localStorage.setItem(OPTIONS_MODE_KEY, MODE_LIST[currentModeIndex].id);
        renderModeButton();
      }

      function initMode() {
        const savedMode = localStorage.getItem(OPTIONS_MODE_KEY);
        const foundIndex = MODE_LIST.findIndex((item) => item.id === savedMode);
        currentModeIndex = foundIndex >= 0 ? foundIndex : 0;
        renderModeButton();
      }

      function setCollapsed(collapsed) {
        isCollapsed = collapsed;
        optionsShell.classList.toggle("collapsed", collapsed);
        collapseIcon.innerHTML = collapsed ? '<path d="M7 14l5-5 5 5z" />' : '<path d="M7 10l5 5 5-5z" />';
        expandToggle.setAttribute("aria-hidden", collapsed ? "false" : "true");
        expandToggle.tabIndex = collapsed ? 0 : -1;
      }

      function toggleCollapsed() {
        setCollapsed(!isCollapsed);
      }

      function triggerQuickReply(text) {
        if (!text || ["…", "..."].includes(text.trim()) || text.trim().length === 0) {
          return;
        }

        const mode = MODE_LIST[currentModeIndex];

        try {
          if (typeof triggerSlash === "function") {
            mode.action(text);
          } else {
            console.log("SillyTavern environment not detected. Mode:", mode.id, "Text:", text);
          }
        } catch (error) {
          console.error("triggerQuickReply failed:", error);
        }
      }

      function getInputText() {
        try {
          const parentWindow = window.parent || window;
          const parentDoc = parentWindow.document;

          const selectors = [
            "#send_textarea",
            "#user-input",
            "#chat-input",
            "textarea[name='user_input']",
            ".chat_input",
            "#input_text",
            "textarea",
          ];

          for (const selector of selectors) {
            const el = parentDoc.querySelector(selector);
            if (el) {
              return String(el.value || "");
            }
          }
        } catch (error) {
          return "";
        }

        return "";
      }

      function createOptions(optionsString) {
        optionsGrid.innerHTML = "";

        const options = String(optionsString || "")
          .split("|")
          .map((opt) => opt.trim())
          .filter((opt) => opt.length > 0);

        if (!options.length) {
          const empty = document.createElement("div");
          empty.className = "option-empty";
          empty.textContent = "暂无可用选项";
          optionsGrid.appendChild(empty);
          return;
        }

        const fragment = document.createDocumentFragment();

        options.forEach((option, index) => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "option-item";
          item.textContent = option;
          item.dataset.option = option;
          item.style.animationDelay = `${Math.min(index * 18, 240)}ms`;
          fragment.appendChild(item);
        });

        optionsGrid.appendChild(fragment);
      }

      function getOptionsDataXML() {
        try {
          const chat_message = getChatMessages(getCurrentMessageId())[0];
          const match = chat_message && chat_message.message
            ? chat_message.message.match(/<options>([\s\S]*?)<\/options>/)
            : null;
          return match ? match[0] : "<options></options>";
        } catch (error) {
          return "<options></options>";
        }
      }

      function parseOptionsData(optionsDataXML) {
        const blockMatch = String(optionsDataXML || "").match(/<options>([\s\S]*?)<\/options>/);
        return blockMatch ? String(blockMatch[1]).trim() : "";
      }

      function initOptionsData(retryCount) {
        const xml = getOptionsDataXML();
        const optionsText = parseOptionsData(xml);

        if (optionsText || retryCount >= 10) {
          createOptions(optionsText);
          return;
        }

        setTimeout(() => {
          initOptionsData(retryCount + 1);
        }, 120);
      }

      optionsGrid.addEventListener("click", (event) => {
        const target = event.target.closest(".option-item");
        if (!target) return;

        const optionText = String(target.dataset.option || "").trim();
        if (!optionText) return;

        target.classList.add("sending");
        triggerQuickReply(optionText);

        const mode = MODE_LIST[currentModeIndex];

        setTimeout(() => {
          target.classList.remove("sending");
        }, 220);

        if (mode.autoCollapse) {
          setTimeout(() => {
            setCollapsed(true);
          }, 180);
        }
      });

      modeToggle.addEventListener("click", cycleMode);
      collapseToggle.addEventListener("click", toggleCollapsed);
      expandToggle.addEventListener("click", () => setCollapsed(false));

      setTimeout(function () {
        initMode();
        setCollapsed(false);
        initOptionsData(0);
      }, 0);
    </script>
  </body>
</html>
